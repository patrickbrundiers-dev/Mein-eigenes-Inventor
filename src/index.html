<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app: 'wasm-unsafe-eval'; worker-src 'self' app: blob:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data: blob:; connect-src 'self' app: blob: data:" />
  <title>PBCAD</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="appbar">
      <div class="ab-logo" aria-label="PBCAD"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="l1" d="M3 7.5 12 2.5l9 5-9 5z"/><path class="l2" d="M3 7.5v9l9 5v-9z"/><path class="l3" d="M21 7.5v9l-9 5v-9z"/></svg><span>PBCAD</span></div>
      <div id="ab-cmds" role="toolbar" aria-label="Schnellzugriff"></div>
      <nav id="doctabs" aria-label="Dokumente"></nav>
      <div class="ab-spacer"></div>
      <div id="ab-right"></div>
    </div>
    <header id="ribbon"></header>
    <div id="workspace">
      <aside id="browser" aria-label="Modellbrowser"></aside>
      <main id="stage">
        <div id="viewer"></div>
        <svg id="overlay" aria-hidden="true"></svg>
        <div id="drawing-stage" hidden></div>
        <div id="start" hidden></div>
        <div id="hud"></div>
      </main>
      <aside id="props" aria-label="Eigenschaften"></aside>
    </div>
    <nav id="verlauf" aria-label="Verlauf" hidden></nav>
    <footer id="status"></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
