name: Windows-Release
# Manuell starten: Actions → Windows-Release → "Run workflow" → Versionsnummer eingeben.
# Baut die Setup-Datei und veröffentlicht sie als Release – installierte Programme finden das Update dann selbst.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. 0.2.0 (muss höher sein als die installierte)"
        required: true
      veroeffentlichen:
        description: "Als Release veröffentlichen (sonst nur Testbuild als Download)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Vorprüfung unter Linux: ohne grüne Kern- und Geometrie-Tests wird nichts gebaut oder veröffentlicht
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund
      - name: Kern-Tests
        run: node --test test/core.test.mjs test/project.test.mjs test/units.test.mjs test/cutlist.test.mjs test/drawing.test.mjs test/assembly.test.mjs test/settings.test.mjs test/materials.test.mjs test/ribbonlayout.test.mjs test/naming.test.mjs test/commands.test.mjs test/rohrlaser.test.mjs test/sketchshapes.test.mjs test/metall.test.mjs
      - name: Geometrie-Tests
        run: set -o pipefail; node --stack-size=8000 --test --test-reporter=spec test/kernel.test.mjs test/project-kernel.test.mjs test/validation.test.mjs test/parametric.test.mjs test/metall-kernel.test.mjs 2>&1 | grep -v -E "^\*+|Statistics on Transfer|Transfer Mode|Transferring Shape|WorkSession|Step File Name|^\s*$"
  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund
      - name: Version setzen
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - name: Kern-Tests
        run: node --test test/core.test.mjs
      # Als Entwurf anlegen (vor dem Hochladen, sonst kollidieren parallele Uploads). Erst wenn Setup und
      # latest.yml oben sind, wird veröffentlicht – sonst sehen installierte Programme ein Release ohne latest.yml.
      - name: Release als Entwurf anlegen
        if: inputs.veroeffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ inputs.version }}"
          if ! gh release view "$V" > /dev/null 2>&1; then
            gh release create "$V" --draft --target "$GITHUB_SHA" --title "$V" --notes-file build/release-notes.md
          fi
      - name: Setup bauen und veröffentlichen
        if: inputs.veroeffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p protokoll
          npm run release 2>&1 | tee protokoll/release.txt
      - name: Release veröffentlichen
        if: inputs.veroeffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ inputs.version }}"
          ASSETS=$(gh release view "$V" --json assets --jq '.assets[].name')
          echo "$ASSETS"
          for f in latest.yml "PBCAD-Setup-${{ inputs.version }}.exe"; do
            echo "$ASSETS" | grep -qxF "$f" || { echo "::error::$f fehlt im Release $V"; exit 1; }
          done
          gh release edit "$V" --draft=false --latest
      - name: Setup bauen (Testbuild)
        if: ${{ !inputs.veroeffentlichen }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p protokoll
          npm run dist 2>&1 | tee protokoll/release.txt
      - name: Protokoll sichern
        if: always()
        shell: bash
        run: |
          mkdir -p protokoll && cd protokoll
          ls -la ../release >> dateien.txt 2>&1 || true
          git init -q . && git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -qm "Release-Protokoll $GITHUB_RUN_ID" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/release-protokoll
      - name: Setup als Download anhängen
        uses: actions/upload-artifact@v4
        with:
          name: PBCAD-Setup-${{ inputs.version }}
          path: release/*.exe
          retention-days: 14
