name: Probe
on:
  workflow_dispatch:
  push:
    paths: ["tools/probe.mjs", ".github/workflows/probe.yml"]
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install latest
        run: |
          mkdir -p /tmp/probe && cp tools/probe.mjs /tmp/probe/ && cd /tmp/probe
          echo '{"name":"probe","private":true,"type":"module"}' > package.json
          npm install replicad@latest replicad-opencascadejs@latest three@latest esbuild@latest electron-updater@latest --no-audit --no-fund 2>&1 | tail -5
          npm view electron version > /tmp/probe/electron-version.txt
          npm view electron-builder version >> /tmp/probe/electron-version.txt
          npm ls --depth=0
      - name: Probe
        run: cd /tmp/probe && (node --stack-size=8000 probe.mjs > out.txt 2>&1; echo "EXIT $?" >> out.txt); cat electron-version.txt >> out.txt
      - name: Ergebnis sichern
        if: always()
        run: |
          cd /tmp/probe
          git init -q res && cp out.txt res/ && cd res
          git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -qm "probe $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-ergebnisse
